<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Matrix Operations Calculator</h1>
        <form id="matrixForm">
            <label for="operation">Select Operation:</label>
            <select id="operation" name="operation">
                <option value="add">Addition</option>
                <option value="subtract">Subtraction</option>
                <option value="multiply">Multiplication</option>
                <option value="transpose">Transpose</option>
                <option value="determinant">Determinant</option>
                <option value="inverse">Inverse</option>
                <option value="eigen">Eigenvalues & Eigenvectors</option>
                <option value="solve">Solve Linear Equations</option>
            </select>

            <div id="matrixAInput">
                <h3>Matrix A</h3>
                <textarea id="matrixA" placeholder="Enter Matrix A (row-wise, space-separated)"></textarea>
            </div>

            <div id="matrixBInput" style="display: none;">
                <h3>Matrix B</h3>
                <textarea id="matrixB" placeholder="Enter Matrix B (row-wise, space-separated)"></textarea>
            </div>

            <button type="button" onclick="calculate()">Calculate</button>
        </form>

        <h2>Result:</h2>
        <pre id="result"></pre>
    </div>

    <script src="script.js"></script>
</body>
</html>
